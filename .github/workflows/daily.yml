name: daily-macro-tape

on:
  schedule:
    # UTC 22:00（日〜木）= JST 07:00（月〜金）
    - cron: "0 22 * * 0-4"
  workflow_dispatch:        # 手動実行ボタン用

permissions:
  contents: write

concurrency:
  group: macro-tape
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ダッシュボードを生成
        run: python macro_tape.py --out docs/index.html

      - name: 変更があればコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "更新なし"
          else
            git commit -m "更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git push
          fi
